# docker-compose.yml - TP2 INF8200
# Pipeline météo orchestré par Apache Airflow
#
# Services :
#   postgres   - base de données interne d'Airflow (métadonnées)
#   airflow-init    - initialise la base de données et crée l'utilisateur admin
#   airflow-webserver - interface web Airflow (port 8080)
#   airflow-scheduler - exécute les tâches du DAG

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: "tp2_inf8200_secret"
    _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas"
  volumes:
    - ./dags:/opt/airflow/dags          # dossier contenant weather_pipeline_dag.py
    - ./data:/opt/airflow/data          # dossier de sortie des fichiers CSV/JSON
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - airflow-net

services:

  # ------------------------------------------------------------------
  # Base de données PostgreSQL pour les métadonnées Airflow
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s
    networks:
      - airflow-net

  # ------------------------------------------------------------------
  # Initialisation : migrations DB + création de l'utilisateur admin
  # Ce service se termine après l'initialisation (exit 0).
  # ------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: "no"

  # ------------------------------------------------------------------
  # Scheduler : détecte et exécute les tâches du DAG
  # ------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # Webserver : interface graphique accessible sur http://localhost:8080
  # ------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  airflow-logs:

networks:
  airflow-net:
    driver: bridge  