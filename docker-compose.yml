# Weather pipeline orchestrated by Apache Airflow (LocalExecutor)
#
#   docker compose up -d        then open http://localhost:8080 (admin / admin)
#
# Services:
#   postgres           Airflow metadata database
#   airflow-init       migrates the metadata DB and creates the admin user, then exits
#   airflow-scheduler  runs the DAG tasks
#   airflow-webserver  UI on port 8080
#
# Pipeline outputs (raw JSON, clean Parquet, DuckDB warehouse, reports) land in ./data
# On Linux, set AIRFLOW_UID=$(id -u) in a .env file so files in ./data belong to you.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-only-change-me}
    # pandas, pyarrow and requests ship with the image; only DuckDB is added.
    # (Re-installing pandas here could break Airflow's pinned constraints.)
    _PIP_ADDITIONAL_REQUIREMENTS: "duckdb==1.1.3"
    WEATHER_DATA_DIR: /opt/airflow/data
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - airflow-net

services:

  # ------------------------------------------------------------------
  # PostgreSQL: Airflow metadata database
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s
    networks:
      - airflow-net

  # ------------------------------------------------------------------
  # Init: metadata DB migrations + admin user
  # Exits once done (exit 0).
  # ------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: "no"

  # ------------------------------------------------------------------
  # Scheduler: schedules and runs the DAG tasks
  # ------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # Webserver: UI on http://localhost:8080
  # ------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  airflow-logs:

networks:
  airflow-net:
    driver: bridge  